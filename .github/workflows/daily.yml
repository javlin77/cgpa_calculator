name: Daily Auto Push

on:
  schedule:
    - cron: '0 18 * * *'   # Runs daily at 6 PM UTC
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Make daily change
        run: |
          echo "Updated on $(date)" >> auto_update.txt

      - name: Commit
        run: |
          git config user.name "javlin77"
          git config user.email "javlin77@users.noreply.github.com"
          git add .
          git commit -m "Daily auto update"
          git push
